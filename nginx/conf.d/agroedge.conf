# ==============================================================================
# AgroEdge: Upstream & Reverse-Proxy Configuration
# Configured for SSE Streaming, Service Worker Caching, and High-Payload Edge PWA
# ==============================================================================

upstream agroedge_backend {
    server agroedge-app:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Maximum image payload size (Matches backend MAX_IMAGE_SIZE_BYTES limit)
    client_max_body_size 25M;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Standard Proxy Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 1. PWA Service Worker (CRITICAL: Do not cache sw.js so PWA updates propagate)
    location = /sw.js {
        proxy_pass http://agroedge_backend;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # 2. Web App Manifest
    location = /manifest.json {
        proxy_pass http://agroedge_backend;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=3600" always;
        default_type application/manifest+json;
    }

    # 3. Server-Sent Events (SSE) Live Broadcast Stream
    # Disables proxy buffering and connection caching to ensure instant telemetry delivery
    location = /api/v1/dashboard/stream {
        proxy_pass http://agroedge_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Disable buffering and chunked transfer requirements for streaming
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Long read timeouts to support persistent SSE connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 4. Static Frontend and Dashboard Assets (Aggressive caching with revalidation)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://agroedge_backend;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # 5. Default Route (PWA client, Dashboard, and REST API endpoints)
    location / {
        proxy_pass http://agroedge_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}

