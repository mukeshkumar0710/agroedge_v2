# Render Infrastructure Blueprint for AgroEdge
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: agroedge
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt

    startCommand: python run.py
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: WORKERS
        value: "2"
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: 3.11.9
