version: '3.8'

services:
  agroedge-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agroedge-app
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=2
      - RELOAD=false
      - LOG_LEVEL=info
      - CORS_ORIGINS=*
      - DEFAULT_CENTER_LAT=20.5937
      - DEFAULT_CENTER_LNG=78.9629
      - MAX_IMAGE_SIZE_BYTES=15728640
    expose:
      - "8000"
    ports:
      # Optional direct ASGI access without reverse-proxy
      - "${DIRECT_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - agroedge-net

  agroedge-proxy:
    image: nginx:alpine
    container_name: agroedge-proxy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Uncomment for SSL certificates mounting:
      # - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      agroedge-app:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - agroedge-net

networks:
  agroedge-net:
    driver: bridge
